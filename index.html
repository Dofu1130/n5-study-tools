<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5 道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#eef0e8; --surface:#fbfbf6; --surface-2:#e3e6d8; --border:#cdd0c0;
    --ink:#20232a; --ink-muted:#5c6158; --accent:#2b4a73; --accent-soft:#dfe7f0;
    --accent-contrast:#ffffff; --good:#2f7a52; --good-soft:#dcefe2;
    --bad:#b14a2f; --bad-soft:#f5ded6; --grid-line:rgba(56,62,46,0.055);
    --shadow:0 18px 40px -22px rgba(32,35,42,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181b1f; --surface:#222630; --surface-2:#2b303a; --border:#3b414c;
      --ink:#ece9e0; --ink-muted:#9ba097; --accent:#90b2db; --accent-soft:#273246;
      --accent-contrast:#152030; --good:#7fcc9e; --good-soft:#1f3328;
      --bad:#e38b6c; --bad-soft:#3a2721; --grid-line:rgba(255,255,255,0.045);
      --shadow:0 18px 40px -22px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181b1f; --surface:#222630; --surface-2:#2b303a; --border:#3b414c;
    --ink:#ece9e0; --ink-muted:#9ba097; --accent:#90b2db; --accent-soft:#273246;
    --accent-contrast:#152030; --good:#7fcc9e; --good-soft:#1f3328;
    --bad:#e38b6c; --bad-soft:#3a2721; --grid-line:rgba(255,255,255,0.045);
    --shadow:0 18px 40px -22px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:560px; margin:0 auto; padding:40px 20px 56px;}
  header{text-align:center; margin-bottom:22px;}
  .eyebrow{font-size:0.78rem; letter-spacing:0.12em; color:var(--ink-muted); font-weight:500; margin-bottom:6px;}
  h1{
    font-family:"Zen Maru Gothic",sans-serif; font-weight:700;
    font-size:clamp(1.6rem,5vw,2.1rem); margin:0 0 6px; text-wrap:balance;
  }
  .sub{color:var(--ink-muted); font-size:0.92rem; margin:0;}

  .tools{display:flex; flex-direction:column; gap:12px;}
  .tool{
    display:flex; align-items:center; gap:18px;
    background:var(--surface); border:1px solid var(--border); border-radius:22px;
    box-shadow:var(--shadow); padding:22px 24px;
    color:inherit; text-decoration:none;
    transition:border-color 150ms, transform 100ms;
  }
  .tool:hover, .tool:focus-visible{border-color:var(--accent);}
  .tool:active{transform:scale(0.995);}
  .tool .mark{
    width:64px; height:64px; flex:none; border-radius:14px;
    border:1.5px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:2rem; color:var(--accent);
  }
  .tool .name{font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:1.2rem; margin-bottom:4px;}
  .tool .desc{color:var(--ink-muted); font-size:0.86rem; line-height:1.55;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">N5 日文自學</div>
    <h1>N5 道場</h1>
    <p class="sub">選一個開始練習</p>
  </header>
  <nav class="tools">
    <a class="tool" href="gojuon-dojo/">
      <span class="mark">あ</span>
      <span>
        <div class="name">五十音道場</div>
        <div class="desc">平假名反應速度測驗・記錄反應時間・揪出弱點假名</div>
      </span>
    </a>
    <a class="tool" href="tango-dojo/">
      <span class="mark">語</span>
      <span>
        <div class="name">単語道場</div>
        <div class="desc">N5 核心單字連續 flashcard・先看讀音自己回想</div>
      </span>
    </a>
  </nav>
</div>

</body>
</html>
