<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単語道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#eef0e8;
    --surface:#fbfbf6;
    --surface-2:#e3e6d8;
    --border:#cdd0c0;
    --ink:#20232a;
    --ink-muted:#5c6158;
    --accent:#2b4a73;
    --accent-soft:#dfe7f0;
    --accent-contrast:#ffffff;
    --good:#2f7a52;
    --good-soft:#dcefe2;
    --bad:#b14a2f;
    --bad-soft:#f5ded6;
    --grid-line:rgba(56,62,46,0.055);
    --shadow:0 18px 40px -22px rgba(32,35,42,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181b1f; --surface:#222630; --surface-2:#2b303a; --border:#3b414c;
      --ink:#ece9e0; --ink-muted:#9ba097; --accent:#90b2db; --accent-soft:#273246;
      --accent-contrast:#152030; --good:#7fcc9e; --good-soft:#1f3328;
      --bad:#e38b6c; --bad-soft:#3a2721; --grid-line:rgba(255,255,255,0.045);
      --shadow:0 18px 40px -22px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181b1f; --surface:#222630; --surface-2:#2b303a; --border:#3b414c;
    --ink:#ece9e0; --ink-muted:#9ba097; --accent:#90b2db; --accent-soft:#273246;
    --accent-contrast:#152030; --good:#7fcc9e; --good-soft:#1f3328;
    --bad:#e38b6c; --bad-soft:#3a2721; --grid-line:rgba(255,255,255,0.045);
    --shadow:0 18px 40px -22px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

  .wrap{max-width:560px; margin:0 auto; padding:40px 20px 56px;}
  header{text-align:center; margin-bottom:22px;}
  .eyebrow{font-size:0.78rem; letter-spacing:0.12em; color:var(--ink-muted); font-weight:500; margin-bottom:6px;}
  h1{
    font-family:"Zen Maru Gothic",sans-serif; font-weight:700;
    font-size:clamp(1.6rem,5vw,2.1rem); margin:0 0 6px; text-wrap:balance; color:var(--ink);
  }
  .sub{color:var(--ink-muted); font-size:0.92rem; margin:0;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:22px;
    box-shadow:var(--shadow); padding:28px 26px 26px; position:relative;
  }

  /* ---------- setup ---------- */
  .label-sm{font-size:0.78rem; color:var(--ink-muted); font-weight:500; letter-spacing:0.04em; margin-bottom:10px;}
  .cat-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .cat-chip{
    border:1.5px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:0.86rem; font-weight:500;
    cursor:pointer; transition:border-color 150ms, background 150ms, color 150ms;
    display:inline-flex; align-items:center; gap:6px;
  }
  .cat-chip .n{font-family:"JetBrains Mono",monospace; font-size:0.72rem; opacity:0.75;}
  .cat-chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
  .cat-tools{display:flex; gap:8px; margin-bottom:22px;}
  .cat-tools button{
    border:none; background:none; color:var(--accent); font-size:0.78rem; font-weight:600;
    cursor:pointer; padding:2px 0; text-decoration:underline; text-underline-offset:3px;
  }

  .btn{
    width:100%; border:none; border-radius:14px; padding:15px;
    font-family:"Noto Sans TC",sans-serif; font-weight:700; font-size:1rem; cursor:pointer;
    background:var(--accent); color:var(--accent-contrast); transition:opacity 150ms, transform 100ms;
  }
  .btn:active{transform:scale(0.99);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.secondary{background:var(--surface-2); color:var(--ink);}
  .btn.ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent);}
  .hint{text-align:center; font-size:0.8rem; color:var(--ink-muted); margin-top:10px;}

  .weak-panel{margin-top:18px; padding-top:18px; border-top:1px dashed var(--border);}
  .weak-title{font-size:0.82rem; color:var(--ink-muted); font-weight:500; margin-bottom:10px;}
  .weak-grid{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .weak-item{
    background:var(--bad-soft); border:1px solid var(--bad); border-radius:10px;
    padding:6px 10px; font-family:"Zen Maru Gothic",sans-serif; font-size:0.95rem; color:var(--bad);
  }

  /* ---------- deck ---------- */
  .deck-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .back-link{
    border:none; background:none; color:var(--ink-muted); font-size:0.82rem; cursor:pointer;
    display:flex; align-items:center; gap:4px; padding:0;
  }
  .back-link:hover{color:var(--accent);}
  .counters{
    display:flex; gap:14px; font-family:"JetBrains Mono",monospace; font-size:0.8rem;
    color:var(--ink-muted); font-variant-numeric:tabular-nums;
  }
  .counters b{color:var(--ink); font-weight:600;}
  .counters .know{color:var(--good);}
  .counters .weak{color:var(--bad);}

  .stack{position:relative; margin-bottom:22px;}
  .stack::before, .stack::after{
    content:""; position:absolute; left:50%; border:1px solid var(--border);
    border-radius:18px; background:var(--surface); z-index:0;
  }
  .stack::before{width:92%; height:100%; top:10px; transform:translateX(-50%); opacity:0.65;}
  .stack::after{width:84%; height:100%; top:18px; transform:translateX(-50%); opacity:0.4;}

  .flashcard{
    position:relative; z-index:1; min-height:280px;
    border:1.5px solid var(--border); border-radius:18px; background:var(--surface);
    padding:22px 20px 20px; cursor:pointer; display:flex; flex-direction:column;
    transition:transform 120ms;
  }
  .flashcard:active{transform:scale(0.995);}

  .pos-pill{
    align-self:flex-start; background:var(--accent-soft); color:var(--accent);
    font-size:0.72rem; font-weight:600; padding:4px 10px; border-radius:999px; margin-bottom:18px;
  }

  .word-zone{text-align:center; padding:6px 0 22px;}
  .word{font-family:"Zen Maru Gothic",sans-serif; font-weight:700; color:var(--ink); line-height:1.15;}
  .word.len-s{font-size:clamp(2.6rem,13vw,4rem);}
  .word.len-m{font-size:clamp(2rem,9.5vw,3rem);}
  .word.len-l{font-size:clamp(1.5rem,7vw,2.2rem);}
  .romaji{
    font-family:"JetBrains Mono",monospace; font-size:0.82rem; color:var(--ink-muted);
    margin-top:8px; letter-spacing:0.03em;
  }

  .perforation{
    border-top:1.5px dashed var(--border); margin:0 -4px;
  }

  .reveal-zone{
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:22px 8px 6px; min-height:72px;
  }
  .reveal-hint{color:var(--ink-muted); font-size:0.85rem;}
  .reveal-zone{flex-direction:column; gap:6px;}
  .kanji-reveal{
    font-family:"Zen Maru Gothic",sans-serif; font-weight:500; font-size:1.3rem; color:var(--ink-muted);
  }
  .meaning{
    font-family:"Noto Sans TC",sans-serif; font-weight:700; font-size:1.5rem; color:var(--ink);
  }

  .judge-row{display:flex; gap:10px; margin-top:18px;}
  .judge-row button{
    flex:1; border-radius:12px; padding:13px; font-weight:700; font-size:0.92rem; cursor:pointer;
    border:1.5px solid transparent; transition:opacity 150ms, transform 100ms;
  }
  .judge-row button:active{transform:scale(0.98);}
  .judge-row .weak-btn{background:var(--bad-soft); color:var(--bad); border-color:var(--bad);}
  .judge-row .know-btn{background:var(--good-soft); color:var(--good); border-color:var(--good);}
  .judge-row.placeholder{visibility:hidden;}

  .view{animation:fade 220ms ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .home-link{display:inline-block; font-size:0.8rem; color:var(--ink-muted); text-decoration:none; margin-bottom:14px;}
  .home-link:hover{color:var(--accent);}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="home-link" href="../">← 所有工具</a>
    <div class="eyebrow">N5 單字練習</div>
    <h1>単語道場</h1>
    <p class="sub">連續單字流・先看日文・自己回想再對答案</p>
  </header>
  <div class="card" id="card"></div>
</div>

<script>
(function(){
  "use strict";

  function entries(cat, pos, rows){
    return rows.map(function(r){
      return {w:r[0], r:r[1], m:r[2], zh:r[3], pos:pos, cat:cat};
    });
  }

  var WORDS = []
    .concat(entries('greet','寒暄',[
      ['おはようございます','おはようございます','ohayou gozaimasu','早安'],
      ['こんにちは','こんにちは','konnichiwa','你好（午安）'],
      ['こんばんは','こんばんは','konbanwa','晚安（見面時）'],
      ['さようなら','さようなら','sayounara','再見'],
      ['ありがとうございます','ありがとうございます','arigatou gozaimasu','謝謝'],
      ['すみません','すみません','sumimasen','不好意思・對不起'],
      ['おやすみなさい','おやすみなさい','oyasumi nasai','晚安（睡前）'],
      ['いただきます','いただきます','itadakimasu','我開動了']
    ]))
    .concat(entries('pronoun','代名詞',[
      ['私','わたし','watashi','我'],
      ['あなた','あなた','anata','你'],
      ['彼','かれ','kare','他'],
      ['彼女','かのじょ','kanojo','她'],
      ['これ','これ','kore','這個'],
      ['それ','それ','sore','那個'],
      ['あれ','あれ','are','那個（較遠）'],
      ['ここ','ここ','koko','這裡'],
      ['そこ','そこ','soko','那裡'],
      ['あそこ','あそこ','asoko','那裡（較遠）']
    ]))
    .concat(entries('pronoun','疑問詞',[
      ['誰','だれ','dare','誰'],
      ['何','なに','nani','什麼'],
      ['いつ','いつ','itsu','什麼時候'],
      ['どこ','どこ','doko','哪裡']
    ]))
    .concat(entries('number','數字',[
      ['一','いち','ichi','一・1'],
      ['二','に','ni','二・2'],
      ['三','さん','san','三・3'],
      ['四','よん','yon','四・4'],
      ['五','ご','go','五・5'],
      ['六','ろく','roku','六・6'],
      ['七','なな','nana','七・7'],
      ['八','はち','hachi','八・8'],
      ['九','きゅう','kyuu','九・9'],
      ['十','じゅう','juu','十・10'],
      ['百','ひゃく','hyaku','百・100'],
      ['千','せん','sen','千・1000'],
      ['万','まん','man','萬・10000']
    ]))
    .concat(entries('time','時間',[
      ['今','いま','ima','現在'],
      ['今日','きょう','kyou','今天'],
      ['明日','あした','ashita','明天'],
      ['昨日','きのう','kinou','昨天'],
      ['毎日','まいにち','mainichi','每天'],
      ['朝','あさ','asa','早上'],
      ['昼','ひる','hiru','中午'],
      ['夜','よる','yoru','晚上'],
      ['週間','しゅうかん','shuukan','星期・週'],
      ['月','つき','tsuki','月份・月亮'],

    .concat(entries('family','家族',[
      ['家族','かぞく','kazoku','家人'],
      ['父','ちち','chichi','爸爸（自己的）'],
      ['母','はは','haha','媽媽（自己的）'],
      ['お父さん','おとうさん','otousan','爸爸（稱呼他人的）'],
      ['お母さん','おかあさん','okaasan','媽媽（稱呼他人的）'],
      ['兄弟','きょうだい','kyoudai','兄弟姊妹'],
      ['兄','あに','ani','哥哥（自己的）'],
      ['姉','あね','ane','姊姊（自己的）'],

      ['妹','いもうと','imouto','妹妹'],
      ['子供','こども','kodomo','小孩']
    ]))
    .concat(entries('verb','動詞',[
      ['行く','いく','iku','去'],
      ['来る','くる','kuru','來'],
      ['帰る','かえる','kaeru','回去・回家'],
      ['食べる','たべる','taberu','吃'],
      ['飲む','のむ','nomu','喝'],
      ['見る','みる','miru','看'],
      ['聞く','きく','kiku','聽・問'],
      ['話す','はなす','hanasu','說'],
      ['読む','よむ','yomu','讀'],
      ['書く','かく','kaku','寫'],
      ['買う','かう','kau','買'],
      ['売る','うる','uru','賣'],
      ['する','する','suru','做'],
      ['寝る','ねる','neru','睡覺'],
      ['起きる','おきる','okiru','起床'],
      ['働く','はたらく','hataraku','工作'],
      ['休む','やすむ','yasumu','休息・請假'],
      ['会う','あう','au','見面'],
      ['待つ','まつ','matsu','等待'],
      ['乗る','のる','noru','搭乘'],
      ['入る','はいる','hairu','進入'],
      ['出る','でる','deru','出去・出發'],
      ['分かる','わかる','wakaru','明白・懂'],
      ['言う','いう','iu','說']
    ]))
    .concat(entries('adjective','い形容詞',[
      ['大きい','おおきい','ookii','大的'],
      ['小さい','ちいさい','chiisai','小的'],
      ['新しい','あたらしい','atarashii','新的'],
      ['古い','ふるい','furui','舊的'],
      ['いい','いい','ii','好的'],
      ['悪い','わるい','warui','不好的'],
      ['高い','たかい','takai','貴的・高的'],
      ['安い','やすい','yasui','便宜的'],
      ['おいしい','おいしい','oishii','好吃的'],
      ['暑い','あつい','atsui','炎熱的'],
      ['寒い','さむい','samui','寒冷的'],
      ['冷たい','つめたい','tsumetai','冰涼的'],
      ['難しい','むずかしい','muzukashii','困難的'],
      ['やさしい','やさしい','yasashii','簡單的・親切的'],
      ['忙しい','いそがしい','isogashii','忙碌的'],
      ['楽しい','たのしい','tanoshii','快樂的']
    ]))
    .concat(entries('adjective','な形容詞',[
      ['静か','しずか','shizuka','安靜的'],
      ['にぎやか','にぎやか','nigiyaka','熱鬧的'],
      ['きれい','きれい','kirei','漂亮的・乾淨的'],
      ['元気','げんき','genki','有精神的'],
      ['暇','ひま','hima','空閒的'],
      ['便利','べんり','benri','方便的'],
      ['親切','しんせつ','shinsetsu','親切的'],
      ['好き','すき','suki','喜歡的']
    ]))
    .concat(entries('place','地點・交通',[
      ['学校','がっこう','gakkou','學校'],
      ['病院','びょういん','byouin','醫院'],
      ['銀行','ぎんこう','ginkou','銀行'],
      ['郵便局','ゆうびんきょく','yuubinkyoku','郵局'],
      ['駅','えき','eki','車站'],
      ['空港','くうこう','kuukou','機場'],
      ['店','みせ','mise','商店'],
      ['公園','こうえん','kouen','公園'],
      ['図書館','としょかん','toshokan','圖書館'],
      ['会社','かいしゃ','kaisha','公司'],
      ['家','いえ','ie','家'],
      ['部屋','へや','heya','房間'],
      ['電車','でんしゃ','densha','電車'],
      ['バス','バス','basu','公車'],
      ['車','くるま','kuruma','車子'],
      ['自転車','じてんしゃ','jitensha','腳踏車'],
      ['飛行機','ひこうき','hikouki','飛機'],
      ['デパート','デパート','depaato','百貨公司'],

    ]))
    .concat(entries('food','食物',[
      ['ご飯','ごはん','gohan','飯・餐'],
      ['パン','パン','pan','麵包'],
      ['水','みず','mizu','水'],
      ['お茶','おちゃ','ocha','茶'],
      ['コーヒー','コーヒー','koohii','咖啡'],
      ['肉','にく','niku','肉'],
      ['魚','さかな','sakana','魚'],
      ['野菜','やさい','yasai','蔬菜'],
      ['果物','くだもの','kudamono','水果'],
      ['卵','たまご','tamago','蛋'],
      ['りんご','りんご','ringo','蘋果']
    ]))
    .concat(entries('thing','物品',[
      ['本','ほん','hon','書'],
      ['新聞','しんぶん','shinbun','報紙'],
      ['机','つくえ','tsukue','書桌'],
      ['椅子','いす','isu','椅子'],
      ['かばん','かばん','kaban','包包'],
      ['財布','さいふ','saifu','錢包'],
      ['時計','とけい','tokei','鐘錶'],
      ['傘','かさ','kasa','雨傘'],
      ['電話','でんわ','denwa','電話']
    ]))
    .concat(entries('body','身體',[
      ['頭','あたま','atama','頭'],
      ['手','て','te','手'],
      ['足','あし','ashi','腳'],
      ['目','め','me','眼睛'],
      ['耳','みみ','mimi','耳朵'],
      ['口','くち','kuchi','嘴巴'],
      ['体','からだ','karada','身體'],
      ['病気','びょうき','byouki','生病']
    ]))
    .concat(entries('school','學校・生活',[
      ['学生','がくせい','gakusei','學生'],
      ['先生','せんせい','sensei','老師'],
      ['会社員','かいしゃいん','kaishain','上班族'],
      ['仕事','しごと','shigoto','工作'],
      ['授業','じゅぎょう','jugyou','課程'],
      ['宿題','しゅくだい','shukudai','作業'],
      ['テスト','テスト','tesuto','考試'],
      ['勉強','べんきょう','benkyou','學習'],
      ['友達','ともだち','tomodachi','朋友']
    ]))
    .concat(entries('adverb','副詞',[
      ['とても','とても','totemo','非常'],
      ['あまり','あまり','amari','不太（接否定）'],
      ['もう','もう','mou','已經'],
      ['まだ','まだ','mada','還・尚未'],
      ['すぐ','すぐ','sugu','馬上'],
      ['ちょっと','ちょっと','chotto','一點點'],
      ['たくさん','たくさん','takusan','很多'],
      ['少し','すこし','sukoshi','一點點'],
      ['いつも','いつも','itsumo','總是'],
      ['時々','ときどき','tokidoki','有時候'],
      ['よく','よく','yoku','經常・好好地'],
      ['全然','ぜんぜん','zenzen','完全不（接否定）'],
      ['たぶん','たぶん','tabun','大概'],
      ['一緒に','いっしょに','issho ni','一起']
    ]));

  WORDS.forEach(function(w, i){ w.id = 'w' + i; });

  var CATS = [
    {id:'greet', name:'招呼用語'},
    {id:'pronoun', name:'代名詞・疑問詞'},
    {id:'number', name:'數字'},
    {id:'time', name:'時間'},
    {id:'family', name:'家族'},
    {id:'verb', name:'動詞'},
    {id:'adjective', name:'形容詞'},
    {id:'place', name:'地點・交通'},
    {id:'food', name:'食物'},
    {id:'thing', name:'物品'},
    {id:'body', name:'身體'},
    {id:'school', name:'學校・生活'},
    {id:'adverb', name:'副詞・其他'}
  ];
  CATS.forEach(function(c){ c.count = WORDS.filter(function(w){ return w.cat === c.id; }).length; });

  // ---------- storage ----------
  var STORE_KEY = 'tangoDojoStats_v1';
  function loadStats(){
    try{ var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
  }
  function saveStats(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
  var stats = loadStats();

  function isWeak(id){
    var s = stats[id];
    return !!s && s.weak > s.know;
  }
  function weakList(){
    return WORDS.filter(function(w){ return isWeak(w.id); });
  }

  // ---------- state ----------
  var state = {
    view:'setup',
    selectedCats:{},
    deck:[],
    pos:0,
    current:null,
    revealed:false,
    sessionKnow:0,
    sessionWeak:0,
    onlyWeak:false
  };
  CATS.forEach(function(c){ state.selectedCats[c.id] = true; });

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function buildDeck(){
    var pool;
    if(state.onlyWeak){
      pool = weakList();
    } else {
      var ids = Object.keys(state.selectedCats).filter(function(id){ return state.selectedCats[id]; });
      pool = WORDS.filter(function(w){ return ids.indexOf(w.cat) !== -1; });
    }
    var weak = pool.filter(function(w){ return isWeak(w.id); });
    state.deck = shuffle(pool.concat(weak));
    state.pos = 0;
  }

  function selectedCount(){
    var ids = Object.keys(state.selectedCats).filter(function(id){ return state.selectedCats[id]; });
    return WORDS.filter(function(w){ return ids.indexOf(w.cat) !== -1; }).length;
  }

  function startDeck(onlyWeak){
    state.onlyWeak = !!onlyWeak;
    state.sessionKnow = 0;
    state.sessionWeak = 0;
    buildDeck();
    state.view = 'deck';
    nextCard(true);
  }

  function nextCard(first){
    if(!first){
      state.pos += 1;
    }
    if(state.pos >= state.deck.length){
      buildDeck();
    }
    state.current = state.deck[state.pos];
    state.revealed = false;
    render();
  }

  function mark(know){
    var id = state.current.id;
    var s = stats[id] || {know:0, weak:0};
    if(know){ s.know += 1; state.sessionKnow += 1; }
    else { s.weak += 1; state.sessionWeak += 1; }
    stats[id] = s;
    saveStats(stats);
    nextCard(false);
  }

  // ---------- render: setup ----------
  function renderSetup(){
    var card = document.getElementById('card');
    var chips = CATS.map(function(c){
      var pressed = state.selectedCats[c.id];
      return '<button type="button" class="cat-chip" data-cat="'+c.id+'" aria-pressed="'+pressed+'">'+c.name+' <span class="n">'+c.count+'</span></button>';
    }).join('');

    var weak = weakList();
    var weakHtml = '';
    if(weak.length){
      weakHtml = '<div class="weak-panel"><div class="weak-title">不熟的單字（共 '+weak.length+' 個）</div>'
        + '<div class="weak-grid">' + weak.slice(0,14).map(function(w){ return '<span class="weak-item">'+w.r+'</span>'; }).join('') + '</div>'
        + '<button type="button" class="btn secondary" id="weakStartBtn">只複習不熟的字 ('+weak.length+')</button>'
        + '</div>';
    }

    var total = selectedCount();
    card.innerHTML = '<div class="view">'
      + '<div class="label-sm">選擇單字範圍</div>'
      + '<div class="cat-grid">'+chips+'</div>'
      + '<div class="cat-tools"><button type="button" id="selAll">全選</button><button type="button" id="selNone">全不選</button></div>'
      + '<button type="button" class="btn" id="startBtn" '+(total>0?'':'disabled')+'>開始練習 ('+total+' 個)</button>'
      + (total>0 ? '' : '<div class="hint">請至少選擇一個分類</div>')
      + weakHtml
      + '</div>';

    card.querySelectorAll('.cat-chip').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-cat');
        state.selectedCats[id] = !state.selectedCats[id];
        renderSetup();
      });
    });
    document.getElementById('selAll').addEventListener('click', function(){
      CATS.forEach(function(c){ state.selectedCats[c.id] = true; }); renderSetup();
    });
    document.getElementById('selNone').addEventListener('click', function(){
      CATS.forEach(function(c){ state.selectedCats[c.id] = false; }); renderSetup();
    });
    var startBtn = document.getElementById('startBtn');
    if(startBtn){ startBtn.addEventListener('click', function(){ startDeck(false); }); }
    var weakBtn = document.getElementById('weakStartBtn');
    if(weakBtn){ weakBtn.addEventListener('click', function(){ startDeck(true); }); }
  }

  // ---------- render: deck ----------
  function wordLenClass(w){
    var len = Array.from(w).length;
    if(len <= 2) return 'len-s';
    if(len <= 4) return 'len-m';
    return 'len-l';
  }

  function renderDeck(){
    var card = document.getElementById('card');
    var c = state.current;
    var hasKanji = c.w !== c.r;

    var frontHtml = '<div class="word '+wordLenClass(c.r)+'">'+c.r+'</div>'
      + '<div class="romaji">'+c.m+'</div>';

    var revealHtml = state.revealed
      ? (hasKanji ? '<div class="kanji-reveal">'+c.w+'</div>' : '') + '<div class="meaning">'+c.zh+'</div>'
      : '<div class="reveal-hint">點一下卡片或按空白鍵看意思</div>';

    card.innerHTML = '<div class="view">'
      + '<div class="deck-top">'
        + '<button type="button" class="back-link" id="backBtn">← 返回設定</button>'
        + '<div class="counters"><span class="know">認得 <b>'+state.sessionKnow+'</b></span><span class="weak">不熟 <b>'+state.sessionWeak+'</b></span></div>'
      + '</div>'
      + '<div class="stack">'
      + '<div class="flashcard" id="flashcard">'
      + '<span class="pos-pill">'+c.pos+'</span>'
      + '<div class="word-zone">'+frontHtml+'</div>'
      + '<div class="perforation"></div>'
      + '<div class="reveal-zone" id="revealZone">'+revealHtml+'</div>'
      + '</div>'
      + '</div>'
      + '<div class="judge-row'+(state.revealed?'':' placeholder')+'">'
        + '<button type="button" class="weak-btn" id="weakBtn">← 還不熟</button>'
        + '<button type="button" class="know-btn" id="knowBtn">認得了 →</button>'
      + '</div>'
      + '</div>';

    document.getElementById('backBtn').addEventListener('click', function(){
      state.view = 'setup'; render();
    });
    var flashcard = document.getElementById('flashcard');
    flashcard.addEventListener('click', function(){
      if(!state.revealed){ state.revealed = true; render(); }
      else { mark(true); }
    });
    if(state.revealed){
      document.getElementById('weakBtn').addEventListener('click', function(e){ e.stopPropagation(); mark(false); });
      document.getElementById('knowBtn').addEventListener('click', function(e){ e.stopPropagation(); mark(true); });
    }
  }

  function onKeydown(e){
    if(state.view !== 'deck') return;
    if(e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      if(!state.revealed){ state.revealed = true; render(); }
      else { mark(true); }
    } else if(e.key === 'ArrowRight' || e.key === 'Enter'){
      if(state.revealed){ mark(true); } else { state.revealed = true; render(); }
    } else if(e.key === 'ArrowLeft' || e.key === 'Backspace'){
      if(state.revealed){ e.preventDefault(); mark(false); }
    }
  }
  document.addEventListener('keydown', onKeydown);

  function render(){
    if(state.view === 'setup') renderSetup();
    else renderDeck();
  }

  render();
})();
</script>
</body>
</html>
