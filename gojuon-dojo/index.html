<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五十音道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#eef0e8;
    --surface:#fbfbf6;
    --surface-2:#e3e6d8;
    --border:#cdd0c0;
    --ink:#20232a;
    --ink-muted:#5c6158;
    --accent:#2b4a73;
    --accent-soft:#dfe7f0;
    --accent-contrast:#ffffff;
    --good:#2f7a52;
    --good-soft:#dcefe2;
    --bad:#b14a2f;
    --bad-soft:#f5ded6;
    --grid-line:rgba(56,62,46,0.055);
    --shadow:0 18px 40px -22px rgba(32,35,42,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181b1f;
      --surface:#222630;
      --surface-2:#2b303a;
      --border:#3b414c;
      --ink:#ece9e0;
      --ink-muted:#9ba097;
      --accent:#90b2db;
      --accent-soft:#273246;
      --accent-contrast:#152030;
      --good:#7fcc9e;
      --good-soft:#1f3328;
      --bad:#e38b6c;
      --bad-soft:#3a2721;
      --grid-line:rgba(255,255,255,0.045);
      --shadow:0 18px 40px -22px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181b1f;
    --surface:#222630;
    --surface-2:#2b303a;
    --border:#3b414c;
    --ink:#ece9e0;
    --ink-muted:#9ba097;
    --accent:#90b2db;
    --accent-soft:#273246;
    --accent-contrast:#152030;
    --good:#7fcc9e;
    --good-soft:#1f3328;
    --bad:#e38b6c;
    --bad-soft:#3a2721;
    --grid-line:rgba(255,255,255,0.045);
    --shadow:0 18px 40px -22px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important; transition:none!important;}
  }

  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:40px 20px 56px;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }
  .eyebrow{
    font-size:0.78rem;
    letter-spacing:0.12em;
    color:var(--ink-muted);
    font-weight:500;
    margin-bottom:6px;
  }
  h1{
    font-family:"Zen Maru Gothic", "Noto Sans TC", sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem,5vw,2.1rem);
    margin:0 0 6px;
    text-wrap:balance;
    color:var(--ink);
  }
  .sub{
    color:var(--ink-muted);
    font-size:0.92rem;
    margin:0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:28px 26px 26px;
  }

  /* ---------- setup ---------- */
  .group-list{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
  .group{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    border:1.5px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    background:var(--surface);
    transition:border-color 150ms, background 150ms;
    text-align:left;
  }
  .group[aria-pressed="true"]{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .group .box{
    width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--border);
    flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface);
    font-size:0.75rem;
    color:var(--accent-contrast);
  }
  .group[aria-pressed="true"] .box{
    background:var(--accent); border-color:var(--accent);
  }
  .group .meta{flex:1; min-width:0;}
  .group .name{font-weight:700; font-size:0.96rem;}
  .group .count{color:var(--ink-muted); font-size:0.8rem; margin-top:1px;}
  .group .sample{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:1.15rem;
    color:var(--ink-muted);
    letter-spacing:0.08em;
    flex:none;
  }

  .length-row{margin-bottom:22px;}
  .label-sm{
    font-size:0.78rem; color:var(--ink-muted); font-weight:500;
    letter-spacing:0.04em; margin-bottom:8px;
  }
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:999px;
    padding:8px 16px;
    font-family:"JetBrains Mono", monospace;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    transition:border-color 150ms, background 150ms, color 150ms;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);
  }

  .btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-family:"Noto Sans TC", sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    background:var(--accent);
    color:var(--accent-contrast);
    transition:opacity 150ms, transform 100ms;
  }
  .btn:active{transform:scale(0.99);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn.secondary{
    background:var(--surface-2); color:var(--ink);
  }
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .hint{
    text-align:center; font-size:0.8rem; color:var(--ink-muted); margin-top:10px;
  }

  .weak-panel{margin-top:18px; padding-top:18px; border-top:1px dashed var(--border);}
  .weak-title{font-size:0.82rem; color:var(--ink-muted); font-weight:500; margin-bottom:10px;}
  .weak-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .weak-item{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--bad-soft); border:1px solid var(--bad);
    border-radius:10px; padding:6px 9px; min-width:46px;
  }
  .weak-item .k{font-family:"Zen Maru Gothic",sans-serif; font-size:1.2rem;}
  .weak-item .p{font-family:"JetBrains Mono",monospace; font-size:0.68rem; color:var(--bad);}

  /* ---------- quiz ---------- */
  .progress-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px; font-family:"JetBrains Mono",monospace; font-size:0.82rem;
    color:var(--ink-muted); font-variant-numeric:tabular-nums;
  }
  .progress-bar{
    height:5px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:28px;
  }
  .progress-fill{height:100%; background:var(--accent); transition:width 220ms ease;}

  .kana-cell{
    width:168px; height:168px;
    margin:0 auto 26px;
    border:2px solid var(--border);
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(var(--border) 1px, transparent 1px) 0 50% / 100% 50%,
      linear-gradient(90deg, var(--border) 1px, transparent 1px) 50% 0 / 50% 100%;
    background-repeat:no-repeat;
    background-color:var(--surface);
    position:relative;
  }
  .kana-cell .k{
    font-family:"Zen Maru Gothic", sans-serif;
    font-weight:700;
    font-size:5.4rem;
    color:var(--ink);
    line-height:1;
  }

  .answer-field{
    display:block;
    width:100%;
    text-align:center;
    font-family:"JetBrains Mono", monospace;
    font-size:1.3rem;
    font-weight:600;
    padding:13px;
    border:none;
    border-bottom:2.5px solid var(--border);
    background:transparent;
    color:var(--ink);
    outline:none;
    letter-spacing:0.05em;
  }
  .answer-field:focus{border-bottom-color:var(--accent);}
  .answer-field.correct{border-bottom-color:var(--good); color:var(--good);}
  .answer-field.wrong{border-bottom-color:var(--bad); color:var(--bad);}

  .feedback{
    min-height:26px;
    text-align:center;
    font-size:0.88rem;
    margin-top:10px;
    color:var(--ink-muted);
  }
  .feedback.wrong{color:var(--bad); font-weight:600;}
  .feedback.correct{color:var(--good); font-weight:600;}

  .quiz-stats{
    display:flex; justify-content:center; gap:26px;
    margin-top:24px; padding-top:18px; border-top:1px dashed var(--border);
  }
  .quiz-stats .qs{text-align:center;}
  .quiz-stats .qs .v{
    font-family:"JetBrains Mono",monospace; font-weight:600; font-size:1.05rem;
    font-variant-numeric:tabular-nums;
  }
  .quiz-stats .qs .l{font-size:0.72rem; color:var(--ink-muted); margin-top:2px;}

  /* ---------- results ---------- */
  .stat-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px;}
  .tile{
    background:var(--surface-2); border-radius:14px; padding:16px 8px; text-align:center;
  }
  .tile .v{
    font-family:"JetBrains Mono",monospace; font-weight:700; font-size:1.5rem;
    color:var(--accent); font-variant-numeric:tabular-nums;
  }
  .tile .l{font-size:0.72rem; color:var(--ink-muted); margin-top:4px;}

  .legend{display:flex; gap:16px; justify-content:center; font-size:0.75rem; color:var(--ink-muted); margin-bottom:12px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px; height:9px; border-radius:3px; display:inline-block;}

  .heatmap{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(50px,1fr));
    gap:7px;
    margin-bottom:24px;
  }
  .hcell{
    border-radius:10px;
    padding:8px 4px 6px;
    text-align:center;
    border:1px solid transparent;
  }
  .hcell .k{font-family:"Zen Maru Gothic",sans-serif; font-size:1.3rem; line-height:1;}
  .hcell .r{font-family:"JetBrains Mono",monospace; font-size:0.62rem; margin-top:3px; opacity:0.85;}

  .view{animation:fade 220ms ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  .home-link{display:inline-block; font-size:0.8rem; color:var(--ink-muted); text-decoration:none; margin-bottom:14px;}
  .home-link:hover{color:var(--accent);}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="home-link" href="../">← 所有工具</a>
    <div class="eyebrow">N5 平假名練習</div>
    <h1>五十音道場</h1>
    <p class="sub">隨機測驗・紀錄反應時間・揪出你的弱點假名</p>
  </header>
  <div class="card" id="card"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------- data ----------
  function row(group, pairs){
    return pairs.map(function(p){
      return {kana:p[0], group:group, answers:p[1]};
    });
  }

  var KANA = []
    .concat(row('sei', [
      ['あ',['a']], ['い',['i']], ['う',['u']], ['え',['e']], ['お',['o']],
      ['か',['ka']], ['き',['ki']], ['く',['ku']], ['け',['ke']], ['こ',['ko']],
      ['さ',['sa']], ['し',['shi','si']], ['す',['su']], ['せ',['se']], ['そ',['so']],
      ['た',['ta']], ['ち',['chi','ti']], ['つ',['tsu','tu']], ['て',['te']], ['と',['to']],
      ['な',['na']], ['に',['ni']], ['ぬ',['nu']], ['ね',['ne']], ['の',['no']],
      ['は',['ha']], ['ひ',['hi']], ['ふ',['fu','hu']], ['へ',['he']], ['ほ',['ho']],
      ['ま',['ma']], ['み',['mi']], ['む',['mu']], ['め',['me']], ['も',['mo']],
      ['や',['ya']], ['ゆ',['yu']], ['よ',['yo']],
      ['ら',['ra']], ['り',['ri']], ['る',['ru']], ['れ',['re']], ['ろ',['ro']],
      ['わ',['wa']], ['を',['wo','o']], ['ん',['n','nn']]
    ]))
    .concat(row('daku', [
      ['が',['ga']], ['ぎ',['gi']], ['ぐ',['gu']], ['げ',['ge']], ['ご',['go']],
      ['ざ',['za']], ['じ',['ji','zi']], ['ず',['zu']], ['ぜ',['ze']], ['ぞ',['zo']],
      ['だ',['da']], ['ぢ',['ji','di']], ['づ',['zu','du']], ['で',['de']], ['ど',['do']],
      ['ば',['ba']], ['び',['bi']], ['ぶ',['bu']], ['べ',['be']], ['ぼ',['bo']],
      ['ぱ',['pa']], ['ぴ',['pi']], ['ぷ',['pu']], ['ぺ',['pe']], ['ぽ',['po']]
    ]))
    .concat(row('youon', [
      ['きゃ',['kya']], ['きゅ',['kyu']], ['きょ',['kyo']],
      ['しゃ',['sha','sya']], ['しゅ',['shu','syu']], ['しょ',['sho','syo']],
      ['ちゃ',['cha','tya']], ['ちゅ',['chu','tyu']], ['ちょ',['cho','tyo']],
      ['にゃ',['nya']], ['にゅ',['nyu']], ['にょ',['nyo']],
      ['ひゃ',['hya']], ['ひゅ',['hyu']], ['ひょ',['hyo']],
      ['みゃ',['mya']], ['みゅ',['myu']], ['みょ',['myo']],
      ['りゃ',['rya']], ['りゅ',['ryu']], ['りょ',['ryo']],
      ['ぎゃ',['gya']], ['ぎゅ',['gyu']], ['ぎょ',['gyo']],
      ['じゃ',['ja','zya']], ['じゅ',['ju','zyu']], ['じょ',['jo','zyo']],
      ['びゃ',['bya']], ['びゅ',['byu']], ['びょ',['byo']],
      ['ぴゃ',['pya']], ['ぴゅ',['pyu']], ['ぴょ',['pyo']]
    ]));

  var KANA_BY_CHAR = {};
  KANA.forEach(function(k){ KANA_BY_CHAR[k.kana] = k; });

  var GROUPS = [
    {id:'sei', name:'清音', sub:'せいおん', sample:'あ か さ'},
    {id:'daku', name:'濁音・半濁音', sub:'だくおん', sample:'が ざ ぱ'},
    {id:'youon', name:'拗音', sub:'ようおん', sample:'きゃ しゅ'}
  ];
  GROUPS.forEach(function(g){
    g.count = KANA.filter(function(k){ return k.group === g.id; }).length;
  });

  // ---------- storage ----------
  var STORE_KEY = 'gojuonDojoStats_v1';
  function loadStats(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveStats(stats){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }catch(e){}
  }

  function computeWeak(stats, minAttempts, topN){
    var entries = Object.keys(stats)
      .map(function(k){ return {kana:k, s:stats[k]}; })
      .filter(function(e){ return e.s.total >= minAttempts; })
      .map(function(e){
        return {kana:e.kana, acc:e.s.correct / e.s.total};
      })
      .sort(function(a,b){ return a.acc - b.acc; })
      .slice(0, topN);
    return entries;
  }

  // ---------- state ----------
  var state = {
    view:'setup',
    selected:{sei:true, daku:false, youon:false},
    length:20,
    queue:[],
    index:0,
    sessionLog:[],
    questionStart:0,
    pending:false,
    advanceTimer:null
  };
  var allTime = loadStats();

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function availableCount(){
    var ids = Object.keys(state.selected).filter(function(id){ return state.selected[id]; });
    return KANA.filter(function(k){ return ids.indexOf(k.group) !== -1; }).length;
  }

  function startQuiz(explicitList){
    var pool;
    if(explicitList){
      pool = explicitList;
    } else {
      var ids = Object.keys(state.selected).filter(function(id){ return state.selected[id]; });
      pool = KANA.filter(function(k){ return ids.indexOf(k.group) !== -1; });
    }
    var n = explicitList ? explicitList.length : Math.min(state.length, pool.length);
    state.queue = shuffle(pool).slice(0, n);
    state.index = 0;
    state.sessionLog = [];
    state.view = 'quiz';
    render();
  }

  function currentCard(){ return state.queue[state.index]; }

  function submitAnswer(raw){
    if(state.pending) return;
    var card = currentCard();
    var val = raw.trim().toLowerCase();
    if(val === '') return;
    var elapsed = Date.now() - state.questionStart;
    var ok = card.answers.indexOf(val) !== -1;
    state.pending = true;
    state.sessionLog.push({kana:card.kana, romaji:card.answers[0], correct:ok, timeMs:elapsed});

    var s = allTime[card.kana] || {correct:0, total:0, timeMs:0};
    s.total += 1;
    if(ok) s.correct += 1;
    s.timeMs += elapsed;
    allTime[card.kana] = s;
    saveStats(allTime);

    renderFeedback(ok, card, elapsed);

    var delay = ok ? 650 : 1500;
    state.advanceTimer = setTimeout(nextQuestion, delay);
  }

  function nextQuestion(){
    clearTimeout(state.advanceTimer);
    state.pending = false;
    state.index += 1;
    if(state.index >= state.queue.length){
      state.view = 'results';
    }
    render();
  }

  // ---------- render: setup ----------
  function renderSetup(){
    var card = document.getElementById('card');
    var weak = computeWeak(allTime, 3, 8);

    var groupsHtml = GROUPS.map(function(g){
      var pressed = state.selected[g.id];
      return '<div class="group" role="button" tabindex="0" data-group="'+g.id+'" aria-pressed="'+pressed+'">'
        + '<span class="box">' + (pressed ? '✓' : '') + '</span>'
        + '<span class="meta"><div class="name">'+g.name+' <span style="font-weight:400;color:var(--ink-muted);font-size:0.78rem;">'+g.sub+'</span></div>'
        + '<div class="count">'+g.count+' 字</div></span>'
        + '<span class="sample">'+g.sample+'</span>'
        + '</div>';
    }).join('');

    var lengths = [10,20,30];
    var total = availableCount();
    var lengthChips = lengths.map(function(n){
      return '<button type="button" class="chip" data-len="'+n+'" aria-pressed="'+(state.length===n)+'">'+n+' 題</button>';
    }).join('') + '<button type="button" class="chip" data-len="all" aria-pressed="'+(state.length==='all')+'">全部 ('+total+')</button>';

    var weakHtml = '';
    if(weak.length){
      weakHtml = '<div class="weak-panel"><div class="weak-title">你的弱點假名（歷史正確率最低）</div><div class="weak-grid">'
        + weak.map(function(w){
            var info = KANA_BY_CHAR[w.kana];
            return '<div class="weak-item"><span class="k">'+w.kana+'</span><span class="p">'+Math.round(w.acc*100)+'%</span></div>';
          }).join('')
        + '</div></div>';
    }

    var canStart = total > 0;

    card.innerHTML = '<div class="view">'
      + '<div class="label-sm">選擇練習範圍</div>'
      + '<div class="group-list">'+groupsHtml+'</div>'
      + '<div class="length-row"><div class="label-sm">題數</div><div class="chip-row">'+lengthChips+'</div></div>'
      + '<button type="button" class="btn" id="startBtn" '+(canStart?'':'disabled')+'>開始測驗</button>'
      + (canStart ? '' : '<div class="hint">請至少選擇一組假名</div>')
      + weakHtml
      + '</div>';

    card.querySelectorAll('.group').forEach(function(el){
      function toggle(){
        var id = el.getAttribute('data-group');
        state.selected[id] = !state.selected[id];
        renderSetup();
      }
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
    });
    card.querySelectorAll('.chip').forEach(function(el){
      el.addEventListener('click', function(){
        var len = el.getAttribute('data-len');
        state.length = (len === 'all') ? 'all' : parseInt(len,10);
        renderSetup();
      });
    });
    var startBtn = document.getElementById('startBtn');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        if(state.length === 'all'){
          var tmp = state.length;
          state.length = availableCount();
          startQuiz();
          state.length = tmp;
        } else {
          startQuiz();
        }
      });
    }
  }

  // ---------- render: quiz ----------
  function renderQuiz(){
    var card = document.getElementById('card');
    var c = currentCard();
    var n = state.queue.length;
    var correctSoFar = state.sessionLog.filter(function(l){return l.correct;}).length;
    var avgTime = state.sessionLog.length
      ? Math.round(state.sessionLog.reduce(function(a,l){return a+l.timeMs;},0) / state.sessionLog.length)
      : 0;

    card.innerHTML = '<div class="view">'
      + '<div class="progress-row"><span>第 '+(state.index+1)+' / '+n+' 題</span><span>正確 '+correctSoFar+'</span></div>'
      + '<div class="progress-bar"><div class="progress-fill" style="width:'+((state.index)/n*100)+'%"></div></div>'
      + '<div class="kana-cell"><span class="k">'+c.kana+'</span></div>'
      + '<input class="answer-field" id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入羅馬拼音">'
      + '<div class="feedback" id="feedback">按 Enter 送出</div>'
      + '<div class="quiz-stats">'
      + '<div class="qs"><div class="v">'+(state.sessionLog.length ? Math.round(correctSoFar/state.sessionLog.length*100) : 0)+'%</div><div class="l">本次正確率</div></div>'
      + '<div class="qs"><div class="v">'+avgTime+'<span style="font-size:0.7rem;">ms</span></div><div class="l">平均反應</div></div>'
      + '</div>'
      + '</div>';

    var input = document.getElementById('answerInput');
    state.questionStart = Date.now();
    input.focus();
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        if(state.pending){
          nextQuestion();
        } else {
          submitAnswer(input.value);
        }
      }
    });
  }

  function renderFeedback(ok, card, elapsed){
    var input = document.getElementById('answerInput');
    var fb = document.getElementById('feedback');
    if(!input || !fb) return;
    input.classList.add(ok ? 'correct' : 'wrong');
    input.readOnly = true;
    if(ok){
      fb.textContent = '正確！（'+elapsed+' ms）';
      fb.className = 'feedback correct';
    } else {
      fb.textContent = '正確答案是「'+card.answers[0]+'」';
      fb.className = 'feedback wrong';
    }
  }

  // ---------- render: results ----------
  function renderResults(){
    var card = document.getElementById('card');
    var log = state.sessionLog;
    var total = log.length;
    var correct = log.filter(function(l){return l.correct;}).length;
    var acc = total ? Math.round(correct/total*100) : 0;
    var avgTime = total ? Math.round(log.reduce(function(a,l){return a+l.timeMs;},0)/total) : 0;

    var sorted = log.slice().sort(function(a,b){
      if(a.correct !== b.correct) return a.correct ? 1 : -1;
      return b.timeMs - a.timeMs;
    });

    var heat = sorted.map(function(l){
      var cls, color, bg;
      if(!l.correct){
        bg='var(--bad-soft)'; color='var(--bad)';
      } else if(l.timeMs >= 1500){
        bg='var(--accent-soft)'; color='var(--accent)';
      } else {
        bg='var(--good-soft)'; color='var(--good)';
      }
      return '<div class="hcell" style="background:'+bg+';border-color:'+color+';">'
        + '<div class="k" style="color:'+color+'">'+l.kana+'</div>'
        + '<div class="r" style="color:'+color+'">'+l.romaji+'</div>'
        + '</div>';
    }).join('');

    var missedList = log.filter(function(l){ return !l.correct; }).map(function(l){ return l.kana; });

    card.innerHTML = '<div class="view">'
      + '<div class="label-sm" style="text-align:center;margin-bottom:16px;">測驗結果</div>'
      + '<div class="stat-tiles">'
      + '<div class="tile"><div class="v">'+acc+'%</div><div class="l">正確率</div></div>'
      + '<div class="tile"><div class="v">'+avgTime+'</div><div class="l">平均反應(ms)</div></div>'
      + '<div class="tile"><div class="v">'+total+'</div><div class="l">測驗字數</div></div>'
      + '</div>'
      + '<div class="legend">'
        + '<span><span class="dot" style="background:var(--good);"></span>答對且快（&lt;1.5s）</span>'
        + '<span><span class="dot" style="background:var(--accent);"></span>答對但慢</span>'
        + '<span><span class="dot" style="background:var(--bad);"></span>答錯</span>'
      + '</div>'
      + '<div class="heatmap">'+heat+'</div>'
      + '<div class="btn-row">'
      + '<button type="button" class="btn secondary" id="retryBtn" '+(missedList.length?'':'disabled')+'>重測錯誤的字 ('+missedList.length+')</button>'
      + '<button type="button" class="btn" id="restartBtn">重新開始</button>'
      + '</div>'
      + '</div>';

    var retryBtn = document.getElementById('retryBtn');
    if(retryBtn && missedList.length){
      retryBtn.addEventListener('click', function(){
        var list = missedList.map(function(k){ return KANA_BY_CHAR[k]; });
        startQuiz(list);
      });
    }
    document.getElementById('restartBtn').addEventListener('click', function(){
      state.view = 'setup';
      render();
    });
  }

  function render(){
    if(state.view === 'setup') renderSetup();
    else if(state.view === 'quiz') renderQuiz();
    else renderResults();
  }

  render();
})();
</script>
</body>
</html>
